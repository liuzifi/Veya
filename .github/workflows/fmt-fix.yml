name: fmt-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Run cargo fmt
        run: cargo +1.99.0 fmt
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: apply cargo fmt formatting"
          git push origin HEAD:${{ github.ref_name }}

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          rustup default 1.99.0-x86_64-pc-windows-msvc
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'veya-appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          cargo test --locked --workspace

      - name: Check workspace
        run: cargo check --locked --workspace

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build release installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Nsis 'C:\Program Files (x86)\NSIS\makensis.exe'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/veya-setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: artifacts

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Veya ${{ steps.version.outputs.version }}
          body: |
            ## Veya ${{ steps.version.outputs.version }}

            Download the installer below (`veya-setup.exe`) and run it to install Veya.

            See the [release notes](https://github.com/liuzifi/Veya/blob/main/docs/releases/v${{ steps.version.outputs.version }}.md) for details.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/veya-setup.exe
